<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="UP Scholarship November 2026 verification timeline">
  <rect width="900" height="250" fill="#eff6ff"/>
  <text x="450" y="28" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">UP Scholarship 2026-27 — November Timeline</text>
  <line x1="60" y1="125" x2="840" y2="125" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="90" cy="125" r="9" fill="#2563eb"/>
    <text x="90" y="100" font-size="14" font-weight="700" fill="#1d4ed8">10 Nov</text>
    <text x="90" y="82" font-size="12" fill="#374151">Institution verification</text>
    <text x="90" y="66" font-size="12" fill="#374151">(Fresh)</text>
    <circle cx="270" cy="125" r="9" fill="#2563eb"/>
    <text x="270" y="160" font-size="14" font-weight="700" fill="#1d4ed8">6–20 Nov</text>
    <text x="270" y="178" font-size="12" fill="#374151">NIC scrutiny</text>
    <text x="270" y="194" font-size="12" fill="#374151">(Renewal)</text>
    <circle cx="450" cy="125" r="9" fill="#2563eb"/>
    <text x="450" y="100" font-size="14" font-weight="700" fill="#1d4ed8">25 Nov</text>
    <text x="450" y="82" font-size="12" fill="#374151">University verification</text>
    <text x="450" y="66" font-size="12" fill="#374151">(Fresh)</text>
    <circle cx="630" cy="125" r="9" fill="#16a34a"/>
    <text x="630" y="160" font-size="14" font-weight="700" fill="#166534">21 Nov – 20 Dec</text>
    <text x="630" y="178" font-size="12" fill="#374151">Correction window</text>
    <text x="630" y="194" font-size="12" fill="#374151">(Renewal + Inter)</text>
    <circle cx="810" cy="125" r="9" fill="#16a34a"/>
    <text x="810" y="100" font-size="14" font-weight="700" fill="#166534">21–31 Dec</text>
    <text x="810" y="82" font-size="12" fill="#374151">First payment</text>
    <text x="810" y="66" font-size="12" fill="#374151">(PFMS)</text>
  </g>
  <text x="450" y="235" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6b7280">Dates as per the official schedule on scholarship.up.gov.in — edistrictupseva.com</text>
</svg>
